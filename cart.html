<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechShop | Cart</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header>

    <div class="logo">

        <h2>🛒 TechShop</h2>

    </div>

    <nav>

        <ul>

            <li><a href="index.html">Home</a></li>

            <li><a href="products.html">Products</a></li>

            <li><a href="about.html">About</a></li>

            <li><a href="contact.html">Contact</a></li>

            <li>

                <a href="cart.html" class="active">

                    <i class="fa-solid fa-cart-shopping"></i>

                    Cart

                    <span id="cart-count">0</span>

                </a>

            </li>

        </ul>

    </nav>

</header>

<section class="page-title">

    <h1>Shopping Cart</h1>

</section>

<section class="cart-container">

    <div id="cart-items">

    </div>

    <aside class="cart-summary">
        <div class="summary-heading"><h2>Order Summary</h2><span id="cart-items-count">0 items</span></div>
        <div class="summary-row"><span>Subtotal</span><strong id="subtotal-price">$0.00</strong></div>
        <div class="summary-row"><span>Shipping</span><strong id="shipping-price">FREE</strong></div>
        <hr>
        <div class="summary-row total-row"><span>Total</span><strong id="total-price">$0.00</strong></div>
        <button id="checkout" class="checkout-btn"><i class="fa-solid fa-lock"></i> Secure Checkout</button>
        <p class="secure-note"><i class="fa-solid fa-shield-halved"></i> Demo checkout — no real payment is processed.</p>
    </aside>

    <div id="checkout-modal" class="modal">
      <div class="modal-content">
        <button id="close-modal" class="modal-close" type="button">&times;</button>
        <h2>Complete Your Order</h2>
        <p>This is a portfolio demo checkout.</p>
        <form id="checkout-form">
          <input required placeholder="Full name" aria-label="Full name">
          <input required type="email" placeholder="Email address" aria-label="Email address">
          <textarea required placeholder="Delivery address" aria-label="Delivery address"></textarea>
          <button class="checkout-btn" type="submit">Place Demo Order</button>
        </form>
      </div>
    </div>

</section>

<script src="products-data.js"></script>
<script src="store.js"></script>
<script src="cart.js"></script>

</body>

</html>
