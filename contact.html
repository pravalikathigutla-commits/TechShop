<section class="page-title">

<section class="contact-section">

    <div class="contact-info">

        <h2>Get in Touch</h2>

        <p><strong>Email:</strong> pravalikathigutla@gmail.com</p>

        <p><strong>Phone:</strong> +91 8555943152</p>

        <p><strong>Location:</strong> Hyderabad, India</p>

    </div>

    <div class="contact-form">

        <form action="https://formspree.io/f/mlgqqnjp" method="POST">

            <input
                type="text"
                name="name"
                placeholder="Your Name"
                required>

            <input
                type="email"
                name="email"
                placeholder="Your Email"
                required>

            <input
                type="text"
                name="subject"
                placeholder="Subject"
                required>

            <textarea
                name="message"
                rows="6"
                placeholder="Your Message"
                required></textarea>

            <button type="submit">

                Send Message

            </button>

        </form>

    </div>

</section>
