<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechShop | Products</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<!-- HEADER -->

<header>

    <div class="logo">

        <h2>🛒 TechShop</h2>

    </div>

    <nav>

        <ul>

            <li><a href="index.html">Home</a></li>

            <li><a href="products.html" class="active">Products</a></li>

            <li><a href="about.html">About</a></li>

            <li><a href="contact.html">Contact</a></li>

            <li>

                <a href="cart.html">

                    <i class="fa-solid fa-cart-shopping"></i>

                    Cart

                    <span id="cart-count">0</span>

                </a>

            </li>

        </ul>

    </nav>

</header>

<!-- PAGE TITLE -->

<section class="page-title">

    <h1>Our Products</h1>

    <p>Choose from our latest collection of electronics.</p>

</section>

<!-- SEARCH + FILTER -->

<section class="product-controls">

    <input
        type="text"
        id="searchInput"
        placeholder="Search products...">

    <select id="categoryFilter">
        <option value="all">All Categories</option>
        <option value="Laptop">Laptops</option>
        <option value="Mobile">Mobiles</option>
        <option value="Watch">Smart Watches</option>
        <option value="Headphones">Headphones</option>
    </select>
    <select id="priceFilter">
        <option value="all">Any Price</option>
        <option value="under200">Under $200</option>
        <option value="200to500">$200 – $500</option>
        <option value="over500">Over $500</option>
    </select>
    <select id="sortFilter">
        <option value="default">Sort: Recommended</option>
        <option value="price-low">Price: Low to High</option>
        <option value="price-high">Price: High to Low</option>
        <option value="rating">Top Rated</option>
        <option value="name">Name: A–Z</option>
    </select>

</section>

<!-- PRODUCTS -->

<section class="products-page">
    <div class="results-bar"><span id="result-count">0 products</span><span>Free shipping on orders over $500</span></div>
    <div id="product-list" class="products-grid">

        <!-- JavaScript will load products here -->

    </div>

</section>

<script src="products-data.js"></script>
<script src="store.js"></script>
<script src="product.js"></script>

</body>

</html>
